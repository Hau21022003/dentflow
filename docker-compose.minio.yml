name: dentflow-minio

services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dentflow-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dentflow-minio-local-only}
      # Vite dev plus the isolated Playwright frontend. Keep this an explicit
      # origin allow-list; deployed environments must use their deployed origin.
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5173,http://127.0.0.1:5174
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dentflow-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dentflow-minio-local-only}
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 1; done
        mc mb --ignore-existing local/dentflow-uploads
        mc anonymous set none local/dentflow-uploads
        mc ilm rule add local/dentflow-uploads --prefix temp/ --expire-days 1 || true

volumes:
  minio-data:
