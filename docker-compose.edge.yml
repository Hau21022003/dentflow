name: dentflow-staging

services:
  nginx:
    image: nginx:1.30.4-alpine@sha256:dc5069ad14f19660b141b21236140b91656bf89bbc3e2417c70ae650cd66104c
    restart: unless-stopped
    init: true
    environment:
      STAGING_DOMAIN: ${STAGING_DOMAIN:?STAGING_DOMAIN is required}
    entrypoint: ["/bin/sh", "/opt/dentflow/run-nginx.sh"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/run-nginx.sh:/opt/dentflow/run-nginx.sh:ro
      - ./deploy/nginx/staging-bootstrap.conf.template:/opt/dentflow/staging-bootstrap.conf.template:ro
      - ./deploy/nginx/staging-https.conf.template:/opt/dentflow/staging-https.conf.template:ro
      - letsencrypt_conf:/etc/letsencrypt:ro
      - letsencrypt_webroot:/var/www/certbot:ro
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && wget -q -O /dev/null http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    image: certbot/certbot:v5.8.0@sha256:f70ad0adbb7e117f0fe42a63c553f28ea451edabc0148757b6efcd9735acaa20
    restart: unless-stopped
    init: true
    environment:
      STAGING_DOMAIN: ${STAGING_DOMAIN:?STAGING_DOMAIN is required}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:?CERTBOT_EMAIL is required}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        trap 'exit 0' TERM INT
        while :; do
          certbot renew \
            --webroot \
            --webroot-path /var/www/certbot \
            --quiet \
            --deploy-hook 'date -u +%s > /var/www/certbot/.nginx-reload'
          sleep 43200 &
          wait $$!
        done
    volumes:
      - letsencrypt_conf:/etc/letsencrypt
      - letsencrypt_webroot:/var/www/certbot
    healthcheck:
      test: ["CMD-SHELL", "test -w /etc/letsencrypt && test -w /var/www/certbot"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  letsencrypt_conf:
  letsencrypt_webroot:
